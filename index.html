<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Respect Start CFW</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
    --blue:#2878ff;
    --blue2:#1559d6;
    --pink:#ff4f9a;
    --pink2:#ff78b3;
    --white:#ffffff;
    --text:#f5f7ff;
    --muted:#aeb8cf;
    --dark:#080d18;
    --dark2:#0d1422;
    --card:rgba(17,26,43,.72);
    --border:rgba(255,255,255,.09);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Cairo",sans-serif;
    background:
        radial-gradient(circle at 15% 15%,rgba(40,120,255,.14),transparent 28%),
        radial-gradient(circle at 85% 30%,rgba(255,79,154,.11),transparent 28%),
        linear-gradient(145deg,#070c16,#0b1220 50%,#080d18);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.22;
    background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:70px 70px;
    mask-image:linear-gradient(to bottom,black,transparent 90%);
}

/* ================= HEADER ================= */

header{
    width:100%;
    position:relative;
    z-index:20;
    padding:22px 5%;
}

.nav{
    max-width:1250px;
    margin:auto;
    height:78px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:10px;
    padding:0 25px;
    background:rgba(9,15,27,.78);
    border:1px solid var(--border);
    border-radius:24px;
    backdrop-filter:blur(18px);
    box-shadow:0 15px 45px rgba(0,0,0,.22);
}

.nav-side{
    display:flex;
    align-items:center;
}

.nav-right{
    justify-content:flex-end;
    gap:14px;
}

.nav-left{
    justify-content:flex-start;
    gap:14px;
}

.nav a{
    color:#dce4f5;
    text-decoration:none;
    font-size:15px;
    font-weight:700;
    transition:.25s;
    white-space:nowrap;
}

.nav a:hover{
    color:#fff;
}

.nav .active{
    color:var(--pink2);
}

.logo{
    width:58px;
    height:58px;
    object-fit:contain;
    display:block;
    filter:drop-shadow(0 8px 20px rgba(255,79,154,.16));
}

/* ================= HERO ================= */

.hero{
    min-height:650px;
    max-width:1250px;
    margin:auto;
    padding:90px 5% 80px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
}

.hero::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:radial-gradient(circle,rgba(40,120,255,.14),transparent 68%);
    left:50%;
    top:30%;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:850px;
}

.owner-box{
    display:inline-flex;
    align-items:center;
    gap:12px;
    padding:10px 18px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.035);
    border-radius:50px;
    margin-bottom:28px;
    color:#bfc9dd;
    font-size:14px;
}

.owner-box strong{
    color:#fff;
}

.owner-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--pink);
    box-shadow:0 0 14px var(--pink);
}

.hero h1{
    font-size:clamp(45px,7vw,82px);
    line-height:1.1;
    font-weight:900;
    letter-spacing:-2px;
    margin-bottom:22px;
}

.gradient{
    background:linear-gradient(90deg,var(--blue),var(--pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.hero p{
    color:var(--muted);
    max-width:690px;
    margin:0 auto 32px;
    font-size:17px;
    line-height:2;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:13px;
    flex-wrap:wrap;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:165px;
    padding:13px 25px;
    border-radius:13px;
    text-decoration:none;
    font-weight:800;
    font-size:14px;
    transition:.25s;
}

.btn-main{
    color:white;
    background:linear-gradient(135deg,var(--pink),#e93783);
    box-shadow:0 12px 35px rgba(255,79,154,.2);
}

.btn-main:hover{
    transform:translateY(-3px);
}

.btn-outline{
    color:#e9efff;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.035);
}

.btn-outline:hover{
    background:rgba(255,255,255,.07);
    transform:translateY(-3px);
}

/* ================= SECTIONS ================= */

section{
    max-width:1250px;
    margin:auto;
    padding:55px 5%;
}

.section-title{
    text-align:center;
    margin-bottom:40px;
}

.section-title span{
    color:var(--pink2);
    font-size:13px;
    font-weight:800;
}

.section-title h2{
    font-size:34px;
    margin-top:8px;
}

.section-title p{
    color:var(--muted);
    margin-top:8px;
}

/* ================= ABOUT ================= */

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
    align-items:stretch;
}

.about-card,
.info-card{
    background:linear-gradient(145deg,rgba(17,27,45,.84),rgba(10,17,29,.7));
    border:1px solid var(--border);
    border-radius:25px;
    padding:35px;
    position:relative;
    overflow:hidden;
}

.about-card::after,
.info-card::after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    background:radial-gradient(circle,rgba(40,120,255,.12),transparent 70%);
    left:-60px;
    bottom:-80px;
}

.about-card h3{
    font-size:25px;
    margin-bottom:14px;
}

.about-card p,
.info-card p{
    color:var(--muted);
    line-height:2;
    font-size:15px;
}

.more-btn{
    display:inline-flex;
    margin-top:24px;
    color:var(--pink2);
    text-decoration:none;
    font-weight:800;
    border-bottom:1px solid rgba(255,79,154,.3);
    padding-bottom:4px;
}

/* ================= RULES ================= */

.rules-preview{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.rule-card{
    padding:28px;
    border-radius:22px;
    background:rgba(15,24,40,.76);
    border:1px solid var(--border);
    transition:.25s;
}

.rule-card:hover{
    transform:translateY(-4px);
    border-color:rgba(255,79,154,.25);
}

.rule-icon{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:linear-gradient(135deg,rgba(40,120,255,.15),rgba(255,79,154,.13));
    margin-bottom:17px;
    font-size:20px;
}

.rule-card h3{
    margin-bottom:8px;
    font-size:18px;
}

.rule-card p{
    color:var(--muted);
    line-height:1.8;
    font-size:13px;
}

.rules-button{
    text-align:center;
    margin-top:30px;
}

/* ================= CONTACT ================= */

.contact-box{
    border-radius:28px;
    padding:48px 30px;
    text-align:center;
    background:
        linear-gradient(135deg,rgba(40,120,255,.11),rgba(255,79,154,.08)),
        rgba(12,20,34,.8);
    border:1px solid var(--border);
}

.contact-box h2{
    font-size:31px;
    margin-bottom:12px;
}

.contact-box p{
    color:var(--muted);
    max-width:650px;
    margin:auto auto 25px;
    line-height:1.9;
}

/* ================= PAGE ================= */

.page{
    max-width:1100px;
    margin:auto;
    padding:60px 5% 90px;
}

.page-head{
    text-align:center;
    margin-bottom:45px;
}

.page-head .mini{
    color:var(--pink2);
    font-size:13px;
    font-weight:800;
}

.page-head h1{
    font-size:48px;
    margin:10px 0;
}

.page-head p{
    color:var(--muted);
    max-width:700px;
    margin:auto;
    line-height:2;
}

/* ================= BACK BUTTON ================= */

.back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:30px;
    padding:10px 17px;
    color:#e9efff;
    text-decoration:none;
    font-size:14px;
    font-weight:800;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    transition:.25s;
}

.back:hover{
    color:#fff;
    background:rgba(255,255,255,.08);
    border-color:rgba(255,79,154,.28);
    transform:translateX(-3px);
}

/* ================= RULES PAGE ================= */

.notice{
    padding:22px 25px;
    border-radius:18px;
    background:rgba(255,79,154,.055);
    border:1px solid rgba(255,79,154,.18);
    color:#dce2ef;
    line-height:2;
    margin-bottom:25px;
}

.notice strong{
    color:var(--pink2);
}

.rule-section{
    background:rgba(12,20,34,.8);
    border:1px solid var(--border);
    border-radius:20px;
    margin-bottom:14px;
    overflow:hidden;
}

.rule-section button{
    width:100%;
    border:0;
    background:transparent;
    color:#fff;
    padding:22px 24px;
    text-align:right;
    cursor:pointer;
    font-family:inherit;
    font-size:17px;
    font-weight:800;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.rule-section button span:last-child{
    color:var(--pink2);
    transition:.25s;
}

.rule-content{
    display:none;
    padding:0 25px 25px;
    color:#aeb8cf;
    line-height:2;
}

.rule-content.open{
    display:block;
}

.rule-content ol{
    padding-right:22px;
}

.rule-content li{
    margin:9px 0;
}

/* ================= STORE ================= */

.maintenance{
    text-align:center;
    max-width:700px;
    margin:70px auto;
    padding:60px 30px;
    background:rgba(13,21,35,.82);
    border:1px solid var(--border);
    border-radius:28px;
}

.maintenance-icon{
    font-size:52px;
    margin-bottom:20px;
}

.maintenance h2{
    font-size:30px;
    margin-bottom:12px;
}

.maintenance p{
    color:var(--muted);
    line-height:2;
}

/* ================= FOOTER ================= */

footer{
    max-width:1250px;
    margin:30px auto 0;
    padding:45px 5% 30px;
    border-top:1px solid rgba(255,255,255,.07);
}

.footer-grid{
    display:grid;
    grid-template-columns:1.3fr 1fr 1fr;
    gap:40px;
    padding-bottom:35px;
}

.footer-brand h3{
    font-size:25px;
    margin-bottom:9px;
}

.footer-brand p{
    color:var(--muted);
    line-height:1.9;
    max-width:400px;
    font-size:14px;
}

.footer-title{
    font-weight:800;
    margin-bottom:15px;
}

.footer-links{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.footer-links a{
    color:var(--muted);
    text-decoration:none;
    font-size:14px;
    transition:.2s;
}

.footer-links a:hover{
    color:#fff;
}

.owner-footer{
    background:rgba(255,255,255,.035);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px 18px;
}

.owner-footer small{
    color:#8995ad;
    display:block;
    margin-bottom:4px;
}

.owner-footer strong{
    font-size:18px;
    color:#fff;
}

.copyright{
    padding-top:25px;
    border-top:1px solid rgba(255,255,255,.06);
    color:#758097;
    font-size:12px;
    text-align:center;
}

/* ================= LANGUAGE ================= */

.lang{
    cursor:pointer;
    color:#fff!important;
    padding:7px 11px;
    border-radius:9px;
    background:rgba(255,255,255,.06);
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

    .nav{
        grid-template-columns:1fr auto 1fr;
        gap:8px;
        padding:0 13px;
    }

    .nav-right{
        gap:10px;
    }

    .nav-left{
        gap:10px;
    }

    .nav a{
        font-size:12px;
    }

    .logo{
        width:52px;
        height:52px;
    }

    .about-grid{
        grid-template-columns:1fr;
    }

    .rules-preview{
        grid-template-columns:1fr 1fr;
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:600px){

    header{
        padding:12px 3%;
    }

    .nav{
        height:68px;
        border-radius:18px;
    }

    .nav-right{
        gap:7px;
    }

    .nav-left{
        gap:7px;
    }

    .nav a{
        font-size:10px;
    }

    .nav .lang{
        padding:5px 7px;
    }

    .logo{
        width:46px;
        height:46px;
    }

    .hero{
        min-height:590px;
        padding-top:60px;
    }

    .hero h1{
        font-size:43px;
    }

    .hero p{
        font-size:14px;
    }

    .rules-preview{
        grid-template-columns:1fr;
    }

    .footer-grid{
        grid-template-columns:1fr;
        gap:25px;
    }

    .page-head h1{
        font-size:37px;
    }
}
</style>
</head>

<script>

/* =====================================================
   LANGUAGE
===================================================== */

let language = localStorage.getItem("rs-language") || "ar";

function applyLanguage(){

    document.documentElement.lang = language;
    document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

    document.querySelectorAll("[data-ar]").forEach(el=>{
        el.textContent = language === "ar"
            ? el.dataset.ar
            : el.dataset.en;
    });

    const btn = document.getElementById("langButton");

    if(btn){
        btn.textContent = language === "ar" ? "EN" : "AR";
    }
}

function toggleLanguage(){

    language = language === "ar" ? "en" : "ar";

    localStorage.setItem("rs-language",language);

    render();

    applyLanguage();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function rulesPage(){

<div class="page">

    </a>

            ${language==="ar" ? "القوانين" : "Rules"}
        </h1>

        <p>
            ${
                language==="ar"
                ?
                "اقرأ القوانين والتزم بها للمحافظة على تجربة رول بلاي عادلة ومنظمة للجميع."
                :
                "Read and follow the rules to maintain a fair and organized roleplay experience for everyone."
            }
        </p>

    </div>


    <div class="notice">

        <strong>
            ${language==="ar" ? "ملاحظة مهمة:" : "Important Note:"}
        </strong>

        ${
            language==="ar"
            ?
            "هذه القوانين وضعت لحماية تجربة جميع اللاعبين. تقع مسؤولية معرفة القوانين والالتزام بها على عاتق كل عضو. عدم معرفة القانون لا يعفي من تطبيقه."
            :
            "These rules exist to protect everyone's experience. Every member is responsible for knowing and following them. Not knowing a rule does not exempt you from it."
        }

    </div>


    ${rules.map((rule,index)=>`

        <div class="rule-section">

            <button onclick="toggleRule(${index})">

                <span>
                    ${language==="ar" ? rule.titleAr : rule.titleEn}
                </span>

                <span id="arrow-${index}">+</span>

            </button>

            <div class="rule-content" id="rule-${index}">

                <ol>

                    ${
                        (language==="ar" ? rule.itemsAr : rule.itemsEn)
                        .map(item=>`<li>${item}</li>`)
                        .join("")
                    }

                </ol>

            </div>

        </div>

    `).join("")}

</div>

`;

}


function toggleRule(index){

    const content = document.getElementById("rule-"+index);
    const arrow = document.getElementById("arrow-"+index);

    if(!content) return;

    content.classList.toggle("open");

    arrow.textContent = content.classList.contains("open") ? "−" : "+";
}


/* =====================================================
   RENDER
===================================================== */

function render(){

    const params = new URLSearchParams(window.location.search);

    const page = params.get("page");

    let content;

    if(page === "about"){
        content = aboutPage();
    }
    else if(page === "rules"){
        content = rulesPage();
    }
    else if(page === "store"){
        content = storePage();
    }
    else if(page === "contact"){
        content = contactPage();
    }
    else{
        content = homePage();
    }

    document.getElementById("app").innerHTML = content;

    applyLanguage();

    window.scrollTo(0,0);
}

render();

</script>
